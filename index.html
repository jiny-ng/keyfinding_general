<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Finding W/S · AI 프롬프트 카드 · Day2</title>
<style>
  :root{
    --gold:#002C5F;          /* Hyundai Navy */
    --gold-deep:#001F44;
    --gold-ink:#0B2342;
    --sand:#DCE3EC;          /* Hyundai Light Blue-Gray */
    --sand-2:#C3CEDC;
    --light:#F2F5F9;         /* Light */
    --white:#FFFFFF;
    --ink:#14202E;
    --ink-soft:#4A5868;
    --line:#D3DBE6;
    --ok:#4F7A5C;
    --shadow:0 6px 18px rgba(0,31,68,0.10);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--light);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:60px;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* Day 열 구성: 모바일은 위아래, PC는 Day1 / Day2 좌우 */
  .days{padding:0 16px;}
  .daycol .day{margin:24px 0 0;}
  .daycol .stage{margin:12px 0 0;}
  @media (min-width:960px){
    .wrap{max-width:1240px;}
    .stagegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;}
    .stagegrid .stage{margin:12px 0 0;}
    .stagegrid .stage:only-child{grid-column:1 / -1;}
  }

  header{
    background:linear-gradient(160deg,var(--gold) 0%,var(--gold-deep) 100%);
    color:var(--white);padding:30px 20px 24px;position:relative;overflow:hidden;
  }
  header::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);}
  .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--sand);text-transform:uppercase;margin-bottom:6px;}
  h1{font-size:22px;line-height:1.35;margin:0 0 8px;font-weight:800;}
  .core{font-size:13.5px;color:#E3EAF3;margin:0;}
  .rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .rules span{font-size:11.5px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:4px 10px;border-radius:999px;}

  .guide{padding:16px 16px 0;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--gold-ink);}
  .flow{display:flex;align-items:stretch;gap:6px;}
  .flow .node{flex:1;background:var(--light);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
  .flow .node.ai{background:var(--gold);border-color:var(--gold);color:var(--white);}
  .flow .node b{display:block;font-size:13px;}
  .flow .node small{font-size:11px;opacity:.85;}
  .flow .arrow{align-self:center;color:var(--gold);font-weight:800;}
  .howto{margin:12px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-soft);}
  .howto li{margin-bottom:4px;}
  .howto b{color:var(--ink);}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;}
  .tools a{font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--sand);padding:6px 12px;border-radius:999px;text-decoration:none;}
  .tools .reset{margin-left:0;font-size:11.5px;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-family:inherit;}
  .tools .reset:hover{background:var(--light);}
  .warn{background:#EEF3F9;border:1px solid #C9D6E6;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--gold-ink);margin-top:12px;}
  .warn b{color:var(--gold-deep);}

  .day{display:flex;align-items:center;gap:10px;margin:24px 16px 0;}
  .day .pill{background:var(--ink);color:var(--white);font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:4px 11px;border-radius:999px;}
  .day .q{font-size:13px;font-weight:700;color:var(--gold-ink);}
  .day .line{flex:1;height:1px;background:var(--sand-2);}

  .stage{margin:12px 16px 0;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .stage-head{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:transparent;border:none;text-align:left;cursor:default;font-family:inherit;}
  .stage-num{flex:0 0 auto;min-width:48px;height:34px;padding:0 8px;border-radius:10px;background:var(--gold);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.03em;}
  .stage-num.noai{background:var(--sand-2);color:var(--gold-ink);}
  .stage-title{flex:1;min-width:0;}
  .stage-en{font-size:15px;font-weight:800;color:var(--ink);}
  .stage-kr{font-size:13.5px;color:var(--ink-soft);margin-top:1px;}
  .stage-meta{font-size:11px;color:var(--gold);font-weight:700;margin-top:2px;}
  .chev{display:none;flex:0 0 auto;width:20px;height:20px;color:var(--gold);transition:transform .25s ease;}
  .stage.open .chev{transform:rotate(180deg);}
  .stage-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease;background:var(--sand);}
  .stage.open .stage-body{grid-template-rows:1fr;}
  .stage-body > div{overflow:hidden;min-height:0;}
  .stage-inner{padding:4px 12px 14px;}

  .pcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;}
  .ptitle{font-size:14px;font-weight:800;margin-bottom:4px;display:flex;gap:6px;}
  .ptitle .dot{color:var(--gold);}
  .pdesc{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .callout{font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;line-height:1.5;}
  .callout .tag{flex:0 0 auto;font-weight:800;font-size:11px;padding:1px 8px;border-radius:999px;height:fit-content;white-space:nowrap;}
  .callout.pre{background:var(--light);border:1px solid var(--line);}
  .callout.pre .tag{background:var(--ink);color:var(--white);}
  .callout.post{background:#F3F7F2;border:1px solid #D4E2D6;margin-top:10px;margin-bottom:0;}
  .callout.post .tag{background:var(--ok);color:var(--white);}

  /* Input form */
  .form{border:1px solid var(--sand-2);border-radius:12px;background:#FAFBFD;margin-bottom:10px;overflow:hidden;}
  .form-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sand);}
  .form-head b{font-size:12.5px;color:var(--gold-ink);}
  .form-head .prog{font-size:11.5px;color:var(--gold-deep);font-weight:700;margin-left:auto;}
  .clear-card{font-size:11.5px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px;font-family:inherit;}
  .form-body{padding:4px 12px 12px;}
  .grp{font-size:11.5px;font-weight:800;color:var(--gold-deep);margin:12px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--line);}
  .grp.shared{color:var(--white);background:var(--gold);border:none;display:inline-block;padding:2px 9px;border-radius:999px;}
  .fld-wrap{margin-top:8px;}
  .fld-wrap label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px;}
  .fld{width:100%;font-family:inherit;font-size:13px;line-height:1.5;color:var(--ink);background:var(--white);border:1px solid var(--sand-2);border-radius:8px;padding:7px 9px;resize:vertical;}
  .fld:focus{outline:2px solid rgba(0,44,95,.35);border-color:var(--gold);}
  .fld.num{width:90px;resize:none;}

  .rowitem{display:flex;gap:6px;align-items:flex-start;margin-top:6px;}
  .rowitem .rn{flex:0 0 22px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--gold-deep);}
  .rowitem .fld{margin-top:0;}
  .issuerow{display:flex;gap:8px;align-items:flex-start;}
  .issuerow .fld{flex:1 1 0;min-width:0;}
  .resetcard{flex:0 0 auto;height:34px;padding:0 14px;border:1px solid var(--sand-2);background:var(--white);color:var(--ink-soft);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit;}
  .resetcard:hover{background:var(--light);}
  .rowitem.pair .fld{flex:1 1 0;min-width:0;}
  .pairhead{display:flex;gap:6px;padding:0 36px 0 28px;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .pairhead span{flex:1 1 0;}
  .delrow{flex:0 0 auto;width:30px;height:32px;border:1px solid var(--sand-2);background:var(--white);color:var(--ink-soft);border-radius:8px;cursor:pointer;font-size:16px;line-height:1;font-family:inherit;}
  .delrow:hover{background:var(--light);}
  .addrow{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--gold-deep);background:var(--white);border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;cursor:pointer;width:100%;font-family:inherit;}
  .addrow:hover{background:#EEF3F9;}
  details.crit{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:12px;}
  details.crit summary{cursor:pointer;font-weight:800;color:var(--gold-ink);}
  details.crit .scroll{overflow-x:auto;margin-top:8px;}
  details.crit table{border-collapse:collapse;width:100%;min-width:520px;}
  details.crit th,details.crit td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top;background:var(--white);}
  details.crit th{background:var(--sand);color:var(--gold-ink);font-size:11.5px;}
  details.crit tr.axis td{background:var(--gold);color:var(--white);font-weight:800;}
  details.crit .note{margin-top:8px;color:var(--ink-soft);}
  .plabel{font-size:11.5px;font-weight:800;color:var(--gold-ink);margin:2px 0 5px;}
  .promptbox{
    background:#F6F8FB;border:1px dashed var(--sand-2);border-radius:10px;padding:10px 11px;
    font-size:12px;line-height:1.65;color:#1B2430;white-space:pre-wrap;word-break:break-word;
    font-family:"SF Mono","Menlo","Consolas","D2Coding",monospace;
    max-height:150px;overflow:hidden;position:relative;
  }
  .promptbox.expanded{max-height:none;}
  .promptbox.truncated::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(180deg,rgba(246,248,251,0),#F6F8FB 90%);}
  .ph{background:#DCE6F2;color:var(--gold-deep);border-radius:4px;padding:0 2px;font-weight:700;}
  .fill{background:#E5EFE3;color:#26472E;border-radius:4px;padding:0 2px;}
  .actions{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .toggle{font-size:12px;color:var(--gold-deep);background:none;border:none;padding:4px 2px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-family:inherit;}
  .status{flex:1;text-align:right;font-size:11.5px;color:var(--ink-soft);}
  .status.warn-s{color:var(--gold-deep);font-weight:700;}
  .copy{display:flex;align-items:center;gap:6px;background:var(--gold);color:var(--white);border:none;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;}
  .copy:hover{background:var(--gold-deep);}
  .copy:active{transform:scale(.96);}
  .copy.copied{background:var(--ok);}
  .copy svg{width:14px;height:14px;}

  .info-list{margin:6px 0 0;padding:0;list-style:none;}
  .info-list li{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:12.5px;}
  .info-list b{color:var(--gold-deep);display:block;margin-bottom:2px;}
  .fld.memo{margin-top:8px;}
  .info-note{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  footer{text-align:center;font-size:11px;color:#8794A5;padding:26px 16px 8px;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">2026 조직문화 진단 · Key Finding Workshop · Day2</div>
  <h1>조직문화의 Key를 알아가는 AI 프롬프트 카드</h1>
</header>

<section class="guide">
  <div class="card">
    <h2>이렇게 사용하세요</h2>
    <ol class="howto" style="margin-top:0">
      <li>입력 칸에 직접 쓰거나 붙여넣습니다. 입력한 내용이 아래 프롬프트에 <b>자동으로 채워집니다.</b></li>
      <li><b>복사</b> 버튼을 눌러 AI에 붙여넣습니다. 카드마다 규칙이 모두 들어 있어 <b>새 대화창에서 바로</b> 쓸 수 있습니다.</li>
      <li>AI 답변은 <b>참고용</b>입니다. 채택·수정·폐기는 내가 정합니다.</li>
    </ol>
    <div class="tools">
      <button class="reset" id="resetAll" type="button">입력 내용 모두 지우기</button>
    </div>
  </div>
</section>

<div id="stages"></div>

<footer>루트컨설팅 · Key Finding W/S 실습용</footer>
</div>

<script>
/* 모든 프롬프트 끝에 붙는 공통 규칙 (어떤 AI 툴에서도 동작하도록 본문에 포함) */
const COMMON = `■ 답변 규칙
- 너는 나의 생각을 점검하고 넓혀주는 레드팀 파트너야. 칭찬이나 동의보다 근거 점검과 보완을 우선해줘.
- "내 생각"에 해당하는 부분이 비어 있거나, 대괄호로 된 빈 칸(예: [이슈 문장])이 그대로 남아 있으면, 분석하지 말고 "먼저 직접 작성해 주세요"라고만 답해줘.
- 내가 입력한 내용 안에서만 근거를 삼아줘. 없는 수치나 사실은 만들지 말고, 모르면 "확인 필요"라고 써줘.
- 내가 쓴 내용은 고치거나 대체하지 말고, 추가·보완·질문의 형태로만 답해줘.
- 한국어로, 번호와 줄바꿈만 사용해줘. (표, 굵은 글씨, 이모지, 코드블록 사용 금지)`;

const PRIORITY_COMMON = `■ 답변 규칙
- 너는 나의 생각을 점검하고 보완해주는 레드팀 파트너야. 칭찬이나 동의보다 근거 점검과 보완을 우선해줘.
- "내 생각"에 해당하는 부분이 비어 있거나, 대괄호로 된 빈 칸이 그대로 남아 있으면, 분석하지 말고 "먼저 직접 작성해 주세요"라고만 답해줘.
- 내가 입력한 내용 안에서만 근거를 삼아줘. 없는 수치나 사실은 만들지 말고, 모르면 "확인 필요"라고 써줘.
- 내가 쓴 내용은 고치거나 대체하지 말고, 추가·보완·질문의 형태로만 답해줘.
- 한국어로 답해줘. 이모지는 쓰지 말고, 점수 정리는 표(표가 어려우면 줄 맞춘 목록)를 사용해줘.`;

const DIVERGE_COMMON = `■ 답변 규칙
- 너는 나의 생각을 넓혀주는 아이디어 파트너야. 평가나 비판보다 다양한 시도와 새로운 각도를 우선해줘.
- "내 생각"에 해당하는 부분이 비어 있거나, 대괄호로 된 빈 칸이 그대로 남아 있으면, 아이디어를 내지 말고 "먼저 직접 작성해 주세요"라고만 답해줘.
- 없는 수치나 사실은 만들지 말고, 모르면 "확인 필요"라고 써줘.
- 내가 쓴 아이디어는 고치거나 대체하지 말고, 새 아이디어를 추가하는 형태로만 답해줘.
- 한국어로, 번호와 줄바꿈만 사용해줘. (표, 굵은 글씨, 이모지, 코드블록 사용 금지)`;

const DEEPEN_COMMON = `■ 답변 규칙
- 너는 나의 생각을 깊게 만들어주는 아이디어 파트너야. 평가나 점수보다 아이디어를 구체적으로 만드는 데 집중해줘.
- "내 생각"에 해당하는 부분이 비어 있거나, 대괄호로 된 빈 칸이 그대로 남아 있으면, 아이디어를 다듬지 말고 "먼저 직접 작성해 주세요"라고만 답해줘.
- 없는 수치나 사실은 만들지 말고, 모르면 "확인 필요"라고 써줘.
- 내가 쓴 아이디어의 이름과 핵심은 고치거나 대체하지 말고, 그 아래에 구체적인 내용을 덧붙이는 형태로만 답해줘.
- 한국어로, 번호와 줄바꿈만 사용해줘. (표, 굵은 글씨, 이모지, 코드블록 사용 금지)`;

/* 여러 카드에서 공유되는 입력값. 본문에서는 {키} 로 표기 */
const SHARED = {
  strength: { label: "강점 (PPT 보고서 템플릿에서 복사해 붙여넣기)", ph: "강점 내용", hint: "보고서의 강점 이슈와 근거(숫자·변화·목소리)를 붙여넣으세요. 없으면 '없음'", area: true, rows: 6 },
  weak:     { label: "개선점 (PPT 보고서 템플릿에서 복사해 붙여넣기)", ph: "개선점 내용", hint: "보고서의 개선점 이슈와 근거(숫자·변화·목소리)를 붙여넣으세요. 없으면 '없음'", area: true, rows: 6 },
  issue:    { label: "이슈", ph: "이슈", hint: "우리가 선정한 핵심 이슈", area: true, rows: 2 },
  asis:     { label: "핵심 이슈 (As-is)", ph: "핵심 이슈", hint: "Day 1에서 도출한 핵심 이슈 - 누가 어떤 상황에서 무엇을 겪는지", area: true },
  tobe:     { label: "개선 방향성 (To-be)", ph: "개선 방향성", hint: "이슈가 개선되면 구성원이 어떻게 달라지는지", area: true },
};

/* 개수 제한 없이 행을 추가할 수 있는 목록 입력. 본문에서는 {*키} 로 표기 */

/* ================= 파싱 ================= */
function esc(s){
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}

function deriveLabel(seg, atStart, hint){
  let s = seg;
  if(atStart) s = s.replace(/^\s*\d+\.\s*/, '');
  s = s.trim().replace(/^[-•]\s*/, '');
  const parts = s.split(/\s\/\s|\s-\s/);
  s = (parts[parts.length - 1] || '').trim();
  const ci = s.lastIndexOf(':');
  if(ci >= 0 && s.slice(ci + 1).trim()) s = s.slice(ci + 1).trim();
  s = s.replace(/[:：\s]+$/, '');
  if(!s || /^Top\d$/.test(s)) return hint || '입력';
  return s;
}

function parseCard(text, pid){
  const out = [];
  const fields = [];
  const sharedKeys = [];
  let section = '', group = '';
  text.split('\n').forEach(raw => {
    let line = raw, optional = false;
    if(line.startsWith('~')){ optional = true; line = line.slice(1); }
    if(line.startsWith('■')){
      const m = line.slice(1).trim().match(/^내 생각\s*-\s*(.+)$/);
      section = m ? m[1] : '';
      group = '';
    }
    const gm = line.match(/^\s{0,2}(\d+)\.\s/) || line.match(/^(Top\d)\s*:/);
    if(gm) group = /^\d+$/.test(gm[1]) ? gm[1] + '번' : gm[1];

    const segs = [];
    const re = /\{(\*?)(\w+)\}|\[([^\]\n]*)\]/g;
    let last = 0, prevEnd = 0, m;
    while((m = re.exec(line))){
      if(m.index > last) segs.push({ t: 'text', s: line.slice(last, m.index) });
      if(m[2] && m[1]){
        if(!LISTS[m[2]]) throw new Error('unknown list key: ' + m[2]);
        const key = pid + ':list:' + m[2];
        fields.push({ key, list: true, label: LISTS[m[2]].label, hint: LISTS[m[2]].hint, add: LISTS[m[2]].add, text: LISTS[m[2]].text, rows: LISTS[m[2]].rows, pair: LISTS[m[2]].pair, group: '' });
        segs.push({ t: 'tok', key, list: true, ph: LISTS[m[2]].ph });
      }else if(m[2]){
        if(!SHARED[m[2]]) throw new Error('unknown shared key: ' + m[2]);
        if(!sharedKeys.includes(m[2])) sharedKeys.push(m[2]);
        segs.push({ t: 'tok', key: m[2], ph: SHARED[m[2]].ph });
      }else{
        const hint = m[3].trim();
        const label = deriveLabel(line.slice(prevEnd, m.index), prevEnd === 0, hint);
        const key = pid + ':' + fields.length;
        fields.push({
          key, label, hint,
          group: [section, group].filter(Boolean).join(' '),
          numeric: label === '효과' || label === '실행 용이성'
        });
        segs.push({ t: 'tok', key, ph: hint });
      }
      last = prevEnd = m.index + m[0].length;
    }
    if(last < line.length) segs.push({ t: 'text', s: line.slice(last) });
    out.push({ segs, optional });
  });
  return { lines: out, fields, sharedKeys };
}

const STORE_KEY = 'kf_prompt_state_v1';

  clearTimeout(saveTimer);

    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }, 250);
}
const val = k => {
  const v = state[k];
  if(Array.isArray(v)) return v.some(x => (x || '').trim()) ? 'x' : '';
  return (v || '').trim();
};
const MIN_ROWS = 1;
function getRows(k){
  const a = Array.isArray(state[k]) ? state[k].slice() : [];
  while(a.length < MIN_ROWS) a.push('');
  return a;
}
function listVals(k){
  if(typeof state[k] === 'string') return state[k].split('\n').map(x => x.trim().replace(/^\d+[.)]\s*/, '')).filter(Boolean);
  return getRows(k).map(x => (x || '').trim()).filter(Boolean);
}
function isPair(k){ const L = LISTS[String(k).split(':list:')[1]]; return !!(L && L.pair); }
function pairVals(k){
  const a = getRows(k), b = getRows(k + '|how');
  const n = Math.max(a.length, b.length), out = [];
  for(let i = 0; i < n; i++){
    const x = (a[i] || '').trim(), y = (b[i] || '').trim();
    if(x || y) out.push({ idea: x, how: y });
  }
  return out;
}

    box.querySelectorAll('.rowitem').forEach((r, i) => {
      const t = r.querySelectorAll('textarea');
      t[0].value = rows[i] || ''; t[1].value = hows[i] || '';
    });

  }
  box.innerHTML = rows.map((_, i) => `<div class="rowitem"><span class="rn">${i + 1}</span><textarea class="fld" rows="1" data-k="${esc(k)}" data-i="${i}" placeholder="${esc(hint)}"></textarea><button type="button" class="delrow" data-k="${esc(k)}" data-i="${i}" aria-label="행 삭제">×</button></div>`).join('');
  box.querySelectorAll('textarea').forEach((ta, i) => { ta.value = rows[i]; });
}

function fieldHtml(f, shared, card){
  const k = esc(f.key);
  const label = esc(f.label);
  if(f.list && f.text){
    return `<div class="fld-wrap"><label>${label}</label><textarea class="fld" rows="${f.rows || 6}" data-k="${k}" placeholder="${esc(f.hint || '')}"></textarea></div>`;
  }
  if(f.list){
    return `<div class="fld-wrap" data-list="${k}"><label>${label}</label>${f.pair ? '<div class="pairhead"><span>아이디어</span><span>실행 방법</span></div>' : ''}<div class="rows"></div><button type="button" class="addrow" data-k="${k}">${esc(f.add || '+ 추가')}</button></div>`;
  }
  let input;
  if(f.numeric){
    input = `<input class="fld num" type="number" min="1" max="5" inputmode="numeric" data-k="${k}" placeholder="1~5">`;
  }else{
    const rows = shared ? (shared.rows || (shared.area ? 2 : 1)) : 2;
    input = `<textarea class="fld" rows="${rows}" data-k="${k}" placeholder="${esc(f.hint || '')}"></textarea>`;
  }
  if(card && card.resetBtn && f.key === 'issue'){
    return `<div class="fld-wrap"><label>${label}</label><div class="issuerow">${input}<button type="button" class="resetcard" data-card="${esc(card.pid)}">초기화</button></div></div>`;
  }
  return `<div class="fld-wrap"><label>${label}</label>${input}</div>`;
}

function buildForm(card){
  let html = '';
  if(card.parsed.sharedKeys.length && !card.hideShared){
    card.parsed.sharedKeys.forEach(k => {
      const s = SHARED[k];
      html += fieldHtml({ key: k, label: s.label, hint: s.hint }, s, card);
    });
  }
  let lastGroup = null;
  card.parsed.fields.forEach(f => {
    if(f.group !== lastGroup){
      lastGroup = f.group;
      if(f.group) html += `<div class="grp">${esc(f.group)}</div>`;
    }
    html += fieldHtml(f, null);
  });
  return html;
}

function renderPrompt(card){
  let html = '', unfilled = 0;
  card.parsed.lines.forEach(L => {
    const toks = L.segs.filter(s => s.t === 'tok');
    if(L.optional && toks.every(t => !val(t.key))) return;
    L.segs.forEach(s => {
      if(s.t === 'text'){ html += esc(s.s); return; }
      if(s.list && isPair(s.key)){
        const items = pairVals(s.key);
        if(items.length) html += items.map((t, i) => `<span class="fill">${i + 1}. ${esc(t.idea || '(아이디어 미입력)')}${t.how ? ' / 실행 방법: ' + esc(t.how) : ''}</span>`).join('\n');
        else{ unfilled++; html += `<span class="ph">[${esc(s.ph)}]</span>`; }
        return;
      }
      if(s.list){
        const items = listVals(s.key);
        if(items.length) html += items.map((t, i) => `<span class="fill">${i + 1}. ${esc(t)}</span>`).join('\n');
        else{ unfilled++; html += `<span class="ph">[${esc(s.ph)}]</span>`; }
        return;
      }
      const v = val(s.key);
      if(v) html += `<span class="fill">${esc(v)}</span>`;
      else{ unfilled++; html += `<span class="ph">[${esc(s.ph || ' ')}]</span>`; }
    });
    html += '\n';
  });
  html += '\n' + esc(card.common || COMMON);
  return { html, unfilled };
}

function refreshCard(card){
  const box = document.getElementById(card.pid);
  const r = renderPrompt(card);
  box.innerHTML = r.html;
  box.dataset.unfilled = r.unfilled;
  const keys = card.parsed.sharedKeys.concat(card.parsed.fields.map(f => f.key));
  const filled = keys.filter(k => val(k)).length;
}
function refreshAll(){ cards.forEach(refreshCard); }

let lastDay = null;
DATA.forEach((stage, sIdx) => {
  if(stage.day !== 2) return;
  if(stage.day !== lastDay){
    lastDay = stage.day;
    const d = document.createElement('div');
    d.className = 'day';
    d.innerHTML = `<span class="pill">${DAYS[stage.day].label}</span><span class="q">${DAYS[stage.day].q}</span><span class="line"></span>`;
    cols[stage.day].appendChild(d);
    const g = document.createElement('div');
    g.className = 'stagegrid';
    cols[stage.day].appendChild(g);
    grids[stage.day] = g;
  }

  const el = document.createElement('div');
  el.className = 'stage';
  const bodyId = `stage-body-${sIdx}`;
  el.innerHTML = `
    ${stage.en ? `<button class="stage-head" aria-expanded="false" aria-controls="${bodyId}">
      ${stage.hideNum ? '' : `<div class="stage-num ${stage.noai ? 'noai' : ''}">${stage.num}</div>`}
      <div class="stage-title">
        <div class="stage-en">${stage.en}</div>
        ${stage.kr ? `<div class="stage-kr">${stage.kr}</div>` : ''}
        ${stage.meta ? `<div class="stage-meta">${stage.meta}</div>` : ''}
      </div>
      ${CHEV}
    </button>` : ''}
    <div class="stage-body" id="${bodyId}"><div><div class="stage-inner"></div></div></div>`;
  const inner = el.querySelector('.stage-inner');

  if(stage.info){
    const i = stage.info;
    inner.innerHTML = `
      <div class="info-note" style="margin-top:8px">${i.lead}</div>
      <ul class="info-list">${i.items.map(x => `<li><b>${x[0]}</b>${x[1]}<textarea class="fld memo" rows="3" data-k="${x[2]}" placeholder="${esc(x[3])}"></textarea></li>`).join('')}</ul>
      <div class="info-note">${i.note}</div>`;
  }

  (stage.prompts || []).forEach((p, pIdx) => {
    const pid = `p-${sIdx}-${pIdx}`;
    const card = { pid, parsed: parseCard(p.text, pid), common: p.common, hideShared: !!p.hideShared, resetBtn: !!p.resetBtn };
    cards.push(card);
    const div = document.createElement('div');
    div.className = 'pcard';
    div.innerHTML = `
      <div class="ptitle"><span class="dot">•</span><span>${p.title}</span></div>
      ${p.desc ? `<div class="pdesc">${p.desc}</div>` : ''}
      ${p.extra || ''}
      <div class="form">
        <div class="form-body">${buildForm(card)}</div>
      </div>
      <div class="plabel">완성된 프롬프트 (입력한 내용이 자동으로 채워집니다)</div>
      <div class="promptbox expanded" id="${pid}"></div>
      <div class="actions">
        <button type="button" class="clear-card" data-card="${pid}">이 카드 비우기</button>
        <span class="status" id="st-${pid}"></span>
        <button class="copy" type="button" data-target="${pid}">${COPY_ICON}복사</button>
      </div>
      `;
    inner.appendChild(div);
  });

  grids[stage.day].appendChild(el);
});

/* 저장된 값 복원 */
renderAllLists();
document.querySelectorAll('.fld:not([data-i])').forEach(inp => { inp.value = state[inp.dataset.k] || ''; });
refreshAll();

/* ================= 이벤트 ================= */
document.addEventListener('input', (e) => {
  const inp = e.target.closest('.fld');
  if(!inp) return;
  const k = inp.dataset.k;
  if(inp.dataset.i !== undefined){
    const sk = inp.dataset.c === 'how' ? k + '|how' : k;
    const a = getRows(sk); a[Number(inp.dataset.i)] = inp.value; state[sk] = a;
  }else{
    state[k] = inp.value;
  }
  if(SHARED[k]){
    document.querySelectorAll(`.fld[data-k="${k}"]`).forEach(o => { if(o !== inp) o.value = inp.value; });
  }
  saveState();
  refreshAll();
});

document.addEventListener('click', (e) => {
  if(e.target.closest('.stage-head')) return;

  if(e.target.closest('#resetAll')){
    if(!confirm('입력한 내용을 모두 지울까요? (이 기기에 저장된 내용도 삭제됩니다)')) return;
    state = {};
    try{ localStorage.removeItem(STORE_KEY); }catch(err){}
    document.querySelectorAll('.fld:not([data-i])').forEach(inp => { inp.value = ''; });
    renderAllLists();
    refreshAll();
    return;
  }

  const add = e.target.closest('.addrow');
  if(add){
    const k = add.dataset.k;
    const a = getRows(k); a.push(''); state[k] = a;
    if(isPair(k)){ const h = getRows(k + '|how'); while(h.length < a.length) h.push(''); state[k + '|how'] = h; }
    renderRows(k); saveState();
    const tas = document.querySelectorAll('.fld[data-k="' + k + '"][data-i]');
    if(tas.length) tas[tas.length - 1].focus();
    return;
  }
  const del = e.target.closest('.delrow');
  if(del){
    const k = del.dataset.k;
    const a = getRows(k); a.splice(Number(del.dataset.i), 1); state[k] = a;
    if(isPair(k)){ const h = getRows(k + '|how'); h.splice(Number(del.dataset.i), 1); state[k + '|how'] = h; }
    renderRows(k); saveState(); refreshAll();
    return;
  }

  const rst = e.target.closest('.resetcard');
  if(rst){
    if(!confirm('이슈와 아이디어 입력을 모두 지우고 새 이슈로 다시 시작할까요?')) return;
    const card = cards.find(c => c.pid === rst.dataset.card);
    card.parsed.fields.forEach(f => { delete state[f.key]; delete state[f.key + '|how']; });
    card.parsed.sharedKeys.forEach(k => { delete state[k]; });
    rst.closest('.pcard').querySelectorAll('.fld').forEach(inp => { if(!inp.dataset.i) inp.value = ''; });
    renderAllLists();
    saveState(); refreshAll();
    return;
  }

  const clr = e.target.closest('.clear-card');
  if(clr){
    const card = cards.find(c => c.pid === clr.dataset.card);
    card.parsed.fields.forEach(f => { delete state[f.key]; delete state[f.key + '|how']; });
    clr.closest('.pcard').querySelectorAll('.fld').forEach(inp => {
      if(!SHARED[inp.dataset.k]) inp.value = '';
    });
    renderAllLists();
    saveState(); refreshAll();
    return;
  }

  const cp = e.target.closest('.copy');
  if(cp){
    const box = document.getElementById(cp.dataset.target);
    const text = box.textContent;
    const unfilled = Number(box.dataset.unfilled || 0);
    const st = document.getElementById('st-' + cp.dataset.target);
    const done = () => {
      cp.classList.add('copied');
      cp.innerHTML = CHECK_ICON + '복사됨';
      if(unfilled > 0){
        st.textContent = `빈 칸 ${unfilled}개가 남은 채 복사됐어요`;
        st.classList.add('warn-s');
      }else{
        st.textContent = '모든 칸이 채워졌어요';
        st.classList.remove('warn-s');
      }
      setTimeout(() => {
        cp.classList.remove('copied');
        cp.innerHTML = COPY_ICON + '복사';
        st.textContent = ''; st.classList.remove('warn-s');
      }, 2600);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(err){}
      document.body.removeChild(ta);
      done();
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    }else{
      fallback();
    }
  }
});
</script>
